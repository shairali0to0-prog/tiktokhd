<head>
<meta charset="UTF-8">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,Arial;background:#fff;color:#111}
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #eee;padding:12px 5%}
.header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.hero{width:100%;background:#000;padding:60px 20px 50px;text-align:center}
.hero-inner{max-width:850px;margin:0 auto}
.hero h1{font-size:42px;font-weight:900;line-height:1.1;color:#fff}
.hero h1 span{background:linear-gradient(90deg, #FE2C55, #25F4EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{margin-top:12px;color:#a1a1aa;font-size:18px}
.search-wrapper{max-width:720px;margin:30px auto 0}
.search-box{background:#fff;border-radius:16px;padding:8px;display:flex;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.search-box input{flex:1;border:none;outline:none;padding:16px 20px;font-size:16px;border-radius:10px}
.download-main{width:100%;margin-top:14px;background:linear-gradient(90deg, #FE2C55, #ff4d6d);color:#fff;border:none;padding:18px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer}
#status{margin-top:16px;font-weight:600;display:none;color:#fff;background:#27272a;padding:10px;border-radius:8px}
.result-card{display:none;max-width:720px;margin:24px auto 0;background:#18181b;border:1px solid #27272a;border-radius:20px;padding:20px;text-align:left;color:#fff}
.result-top{display:flex;gap:16px}
.result-top img{width:110px;height:150px;object-fit:cover;border-radius:12px}
.dl-grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl-btn{padding:14px;border-radius:12px;font-weight:700;text-align:center;display:block;cursor:pointer;border:none;font-size:14px;width:100%;text-decoration:none}
.dl-hd{background:#fff;color:#000}
.dl-sd{background:#27272a;color:#fff;border:1px solid #3f3f46}
.dl-mp3{background:linear-gradient(90deg, #FE2C55, #25F4EE);color:#fff;grid-column:span 2}
#dlStatus{margin-top:12px;font-size:13px;display:none;padding:12px;border-radius:8px;line-height:1.5}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div class="logo"><div class="logo-icon">♪</div> TikTokHD.pk</div></div></div>
<div class="hero"><div class="hero-inner">
<h1>Download TikTok Videos in <span>HD Without Watermark</span></h1>
<p>Works 100% - Direct Gallery Save - 1 Click</p>
<div class="search-wrapper">
<div class="search-box"><input id="tiktokUrl" type="text" placeholder="Paste TikTok link here..."></div>
<button class="download-main" onclick="downloadNow()" id="mainBtn">⬇ Fetch Video</button>
<div id="status"></div>
<div class="result-card" id="result">
<div class="result-top"><img id="thumb" src=""><div><h3 id="title">Video Ready!</h3><p id="author" style="color:#a1a1aa;font-size:13px;margin-top:6px"></p></div></div>
<div class="dl-grid">
<a id="dlHD" class="dl-btn dl-hd" download>⬇ HD 1080p</a>
<a id="dlSD" class="dl-btn dl-sd" download>⬇ SD 720p</a>
<a id="dlMP3" class="dl-btn dl-mp3" download>🎵 MP3 Audio</a>
</div>
<div id="dlStatus"></div>
</div>
</div>
</div></div>

<script>
let videoData = { hd: '', sd: '', mp3: '', title: 'tiktok' };

function forceDirectDownload(url, filename){
  // Create hidden iframe method + anchor download - works on Android Chrome
  let status = document.getElementById('dlStatus');
  status.style.display='block';
  status.style.background='#0a2e1a';
  status.style.color='#4ade80';
  status.innerHTML = '✅ <b>Download Started!</b><br>📁 If download not auto-started, <b>tap and hold</b> button > <b>Download Link</b><br>Or check <b>Notification bar</b> - Video saves to <b>Downloads/Gallery</b>';

  // Use location href with download attribute - simplest that works
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display='none';
  a.setAttribute('download', filename);
  document.body.appendChild(a);
  a.click();
  
  // Also try window.open as backup after 500ms if first fails
  setTimeout(()=>{
    document.body.removeChild(a);
  }, 1000);
}

async function downloadNow(){
  let url=document.getElementById('tiktokUrl').value.trim();
  if(!url.includes('tiktok')){let s=document.getElementById('status');s.style.display='block';s.innerText='❌ Valid TikTok link paste karo';return}
  let status=document.getElementById('status');status.style.display='block';status.innerText='⏳ Fetching...';document.getElementById('mainBtn').innerText='Loading...';document.getElementById('result').style.display='none';
  try{
    let res=await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
    let data=await res.json();if(data.code!=0)throw new Error(data.msg || 'API Error');
    let d=data.data;
    status.style.display='none';
    document.getElementById('result').style.display='block';
    document.getElementById('mainBtn').innerText='⬇ Fetch Video';
    if(d.cover)document.getElementById('thumb').src=d.cover;
    if(d.title){ 
      let shortTitle = d.title.substring(0,30).replace(/[^a-zA-Z0-9]/g, '_');
      videoData.title = shortTitle || 'tiktok_video';
      document.getElementById('title').innerText=d.title.substring(0,70);
    }
    if(d.author)document.getElementById('author').innerText='By @'+(d.author.unique_id||'user');
    
    // PROPER MAPPING - FIX SD VOICE BUG
    videoData.hd = d.hdplay || d.play;
    videoData.sd = d.play || d.hdplay; // Both are VIDEO
    videoData.mp3 = d.music;
    
    // Set href + download + onclick
    let hdBtn = document.getElementById('dlHD');
    let sdBtn = document.getElementById('dlSD');
    let mp3Btn = document.getElementById('dlMP3');
    
    hdBtn.href = videoData.hd;
    hdBtn.setAttribute('download', videoData.title + '_HD.mp4');
    hdBtn.onclick = (e)=>{ e.preventDefault(); forceDirectDownload(videoData.hd, videoData.title + '_HD1080p.mp4'); };
    
    sdBtn.href = videoData.sd;
    sdBtn.setAttribute('download', videoData.title + '_SD.mp4');
    sdBtn.onclick = (e)=>{ e.preventDefault(); forceDirectDownload(videoData.sd, videoData.title + '_SD720p.mp4'); };
    
    mp3Btn.href = videoData.mp3;
    mp3Btn.setAttribute('download', videoData.title + '.mp3');
    mp3Btn.onclick = (e)=>{ e.preventDefault(); forceDirectDownload(videoData.mp3, videoData.title + '_AUDIO.mp3'); };
    
    document.getElementById('dlStatus').style.display='none';
    document.getElementById('result').scrollIntoView({behavior:'smooth'});
  }catch(e){
    status.innerText='❌ Error: ' + e.message + ' - Try again';
    status.style.display='block';
    document.getElementById('mainBtn').innerText='⬇ Fetch Video';
  }
}
</script>
</body>
</html>
