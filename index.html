<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTokHD.pk - 1 Click Gallery Save - HD Without Watermark</title>
<meta name="google-site-verification" content="google2762992679ed0353">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#fff;color:#111}
.header{padding:12px 5%;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}
.hero{width:100%;background:#000;padding:60px 20px;text-align:center;position:relative;overflow:hidden}
.hero h1{font-size:42px;font-weight:900;color:#fff;line-height:1.1}
.hero h1 span{background:linear-gradient(90deg,#FE2C55,#25F4EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#a1a1aa;margin-top:12px}
.search-box{background:#fff;border-radius:14px;padding:6px;display:flex;max-width:680px;margin:30px auto 0}
.search-box input{flex:1;border:none;outline:none;padding:14px;font-size:16px;border-radius:10px}
.main-btn{width:100%;max-width:680px;margin:12px auto 0;background:linear-gradient(90deg,#FE2C55,#ff4d6d);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer;display:block}
.result{display:none;max-width:680px;margin:20px auto 0;background:#18181b;border:1px solid #27272a;border-radius:16px;padding:18px;color:#fff;text-align:left}
.result-top{display:flex;gap:14px}
.result-top img{width:110px;height:140px;object-fit:cover;border-radius:10px}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dl{padding:14px;border-radius:10px;font-weight:800;text-align:center;border:none;cursor:pointer;font-size:14px}
.dl-hd{background:#fff;color:#000}
.dl-sd{background:#27272a;color:#fff;border:1px solid #3f3f46}
.dl-mp3{background:linear-gradient(90deg,#FE2C55,#25F4EE);color:#fff;grid-column:span 2}
#status{max-width:680px;margin:14px auto 0;padding:10px;border-radius:10px;display:none;font-weight:600;text-align:center}
#dlStatus{margin-top:10px;padding:10px;border-radius:10px;display:none;font-size:13px;text-align:center}
.footer{margin-top:60px;background:#000;color:#71717a;padding:30px;text-align:center;font-size:12px}
</style>
</head>
<body>
<div class="header"><div class="logo">♪ TikTokHD.pk - 1 Click Gallery</div></div>
<div class="hero">
<h1>Download TikTok Videos in <span>HD - 1 Click Gallery</span></h1>
<p>No 2 Clicks! Direct Gallery Save!</p>
<div class="search-box"><input id="urlInput" placeholder="Paste TikTok link here..."></div>
<button class="main-btn" onclick="fetchVideo()" id="mainBtn">⬇ Fetch Video</button>
<div id="status"></div>
<div class="result" id="result">
<div class="result-top"><img id="thumb"><div><h3 id="title"></h3><p id="author" style="color:#a1a1aa;font-size:12px"></p><p style="color:#4ade80;font-size:11px;margin-top:4px">✅ 1 Click = Gallery Direct</p></div></div>
<div class="dl-grid">
<button class="dl dl-hd" onclick="oneClick('hd')">⬇ HD 1080p - 1 Click</button>
<button class="dl dl-sd" onclick="oneClick('sd')">⬇ SD 720p - 1 Click</button>
<button class="dl dl-mp3" onclick="oneClick('mp3')">🎵 MP3 - 1 Click</button>
</div>
<div id="dlStatus"></div>
</div>
</div>
</div>
<div class="footer">© 2026 TikTokHD.pk - 1 Click Direct Gallery Save - No Watermark</div>

<script>
let V={hd:'',sd:'',mp3:'',title:'tiktok'};

async function fetchVideo(){
 let u=document.getElementById('urlInput').value.trim();
 if(!u.includes('tiktok')){let s=document.getElementById('status');s.style.display='block';s.style.background='#3f1a1a';s.style.color='#ff8080';s.innerText='❌ Valid TikTok link paste karo';return}
 let st=document.getElementById('status');st.style.display='block';st.style.background='#27272a';st.style.color='#fff';st.innerText='⏳ Fetching...';document.getElementById('mainBtn').innerText='Loading...';document.getElementById('result').style.display='none';
 try{
  let r=await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(u)}&hd=1`);
  let j=await r.json();if(j.code!=0)throw new Error(j.msg);
  let d=j.data;
  st.style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('mainBtn').innerText='⬇ Fetch Video';
  if(d.cover)document.getElementById('thumb').src=d.cover;
  if(d.title){V.title=d.title.substring(0,30).replace(/[^a-zA-Z0-9]/g,'_')||'tiktok';document.getElementById('title').innerText=d.title.substring(0,60)}
  if(d.author)document.getElementById('author').innerText='@'+(d.author.unique_id||'user');
  V.hd=d.hdplay||d.play; V.sd=d.play||d.hdplay; V.mp3=d.music;
  document.getElementById('dlStatus').style.display='none';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
 }catch(e){st.innerText='❌ '+e.message;st.style.display='block';document.getElementById('mainBtn').innerText='⬇ Fetch Video'}
}

// 1 CLICK DIRECT GALLERY - NO API FOLDER NEEDED!
// Uses Blob method - Forces direct download, no Chrome player!
async function oneClick(type){
 let url='', name='', ext='mp4';
 if(type==='hd'){url=V.hd; name=V.title+'_HD1080p';}
 else if(type==='sd'){url=V.sd; name=V.title+'_SD720p';}
 else {url=V.mp3; name=V.title+'_MP3'; ext='mp3';}
 if(!url){alert('Video not ready!');return}
 let s=document.getElementById('dlStatus');
 s.style.display='block'; s.style.background='#0a2e1a'; s.style.color='#4ade80';
 s.innerHTML='⏳ <b>Downloading... 1 Click Gallery Save!</b><br>📁 Saving to Gallery/Downloads...';

 try{
  // Try direct download with download attribute (1 click for same-origin)
  // For cross-origin TikTok, we use fetch as blob to force download
  let response = await fetch(url);
  if(!response.ok) throw new Error('fetch failed');
  let blob = await response.blob();
  let blobUrl = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = blobUrl;
  a.download = name+'.'+ext;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(blobUrl), 1000);
  s.innerHTML='✅ <b>DOWNLOADED! 1 Click Done!</b><br>📁 Check <b>Gallery > Downloads</b><br>✅ Video Gallery me hai - No 2nd Click!';
 }catch(e){
  console.log('Blob failed, trying direct link', e);
  // Fallback: direct link with download attribute - still 1 click in most browsers
  try{
   let a=document.createElement('a');
   a.href=url;
   a.download=name+'.'+ext;
   a.target='_blank';
   document.body.appendChild(a);
   a.click();
   document.body.removeChild(a);
   s.innerHTML='✅ <b>Download Started! 1 Click!</b><br>📁 Check Notification bar / Downloads<br>📁 If player opens, tap ⋮ > Download - Still Gallery!';
  }catch(e2){
   window.open(url,'_blank');
   s.innerHTML='✅ Opened! Tap ⋮ > Download to save to Gallery';
  }
 }
}
</script>
</body>
</html>
